name: 自动打包并生成安全证明

on:
  push:
    tags:
      - 'v*' # 当你发布以 v 开头的标签时触发，如 v1.0

jobs:
  build:
    permissions:
      id-token: write
      contents: write
      attestations: write
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install PySide6 pyinstaller

      - name: 下载 FFmpeg 引擎
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          tar -xf ffmpeg.zip
          # 将 ffmpeg.exe 移动到根目录
          copy ffmpeg-*-essentials_build/bin/ffmpeg.exe .
          copy ffmpeg-*-essentials_build/bin/ffprobe.exe .

      - name: 使用 PyInstaller 打包
        run: |
          pyinstaller --noconsole --onefile --add-data "ffmpeg.exe;." --add-data "ffprobe.exe;." video_speed_tool.py

      # --- 这就是你截图里的内容：生成安全证明 ---
      - name: 生成构建证明 (Attestation)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/video_speed_tool.exe'

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/video_speed_tool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
